<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)"/>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d6002f'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-size='34' font-weight='900' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"/>
<title>ALE.INK · Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── Foco de teclado ──
   Antes solo 2 inputs tenían algún indicador de foco en TODA la app —
   nada avisaba dónde estabas parado navegando con Tab (botones,
   tarjetas, chips, nav). Se usa :focus-visible (no aparece con clic
   de mouse, solo con teclado) para no ensuciar visualmente el uso
   normal, pero SÍ estar siempre presente para quien navega sin mouse. */
:focus{outline:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.bnav-item:focus-visible,.filter-chip:focus-visible,.subtab-chip:focus-visible{outline-offset:-2px}
.qcard:focus-visible,.sess-card:focus-visible{outline-offset:2px;box-shadow:0 0 0 4px var(--red3)}
/* ── Sistema de íconos (SVG, embebido en el sprite al inicio del body) ──
   Reemplaza los emojis usados como íconos en toda la app. Hereda
   tamaño y color de su contexto, igual que hacía el emoji. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:root{
  color-scheme:dark;
  /* ── DARK (default) ── */
  --bg:#080808;--bg2:#111;--bg3:#181818;--bg4:#222;--bg5:#2a2a2a;
  --surface:#141414;--surface2:#1c1c1c;--surface-raised:#1a1a1a;
  --hairline:rgba(255,255,255,.07);--hairline2:rgba(255,255,255,.12);
  --red:#ff003c;--red2:#cc0030;--red3:rgba(255,0,60,.1);--redg:0 0 24px rgba(255,0,60,.35);
  --w:#f0ede8;--w80:#d4d0cb;--w60:#a8a4a0;--w35:#6a6762;--w10:#242424;
  --green:#00c48c;--green-bg:rgba(0,196,140,.12);
  --amber:#ffab00;--amber-bg:rgba(255,171,0,.12);
  --blue:#4f9eff;--blue-bg:rgba(79,158,255,.12);
  --purple:#a879ff;--purple-bg:rgba(168,121,255,.14);
  --sheet-handle:rgba(255,255,255,.22);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.55);
  --shadow-float:0 4px 16px rgba(0,0,0,.35),0 16px 40px -12px rgba(0,0,0,.6);
  --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.55);
  --tile-bg:rgba(255,255,255,.04);
  /* Fonts */
  --d:'Bebas Neue',sans-serif;--s:'Space Grotesk',sans-serif;--m:'JetBrains Mono',monospace;
  /* Apple-ish easings */
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --sheet-ease:cubic-bezier(.32,.72,0,1);
  --r-sm:14px;--r-md:18px;--r-lg:24px;--r-xl:30px;--r-pill:999px;
  --nav:60px;--bottom:84px;
  /* ── Escala tipográfica ──
     Había 36 tamaños de fuente distintos sin ningún sistema (varios
     casi idénticos entre sí, ej. 0.5/0.52/0.54/0.56/0.68rem). Se
     consolida en una escala clara de 8 pasos, aplicada a los
     elementos que más definen la jerarquía visual (títulos, valores
     de KPI, nombres de tarjeta) — sin tocar cada microtexto existente
     uno por uno, para no arriesgar romper algo que no se pueda
     verificar visualmente en el momento. */
  --fs-2xs:.68rem;--fs-xs:.75rem;--fs-sm:.82rem;--fs-md:.95rem;
  --fs-lg:1.15rem;--fs-xl:1.4rem;--fs-2xl:1.85rem;--fs-3xl:2.4rem;
  /* ── Escala de espaciado (base 4px) ── */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f1ee;--bg2:#fff;--bg3:#fff;--bg4:#ebe9e5;--bg5:#dedbd5;
  --surface:#ffffff;--surface2:#ffffff;--surface-raised:#ffffff;
  --hairline:rgba(0,0,0,.07);--hairline2:rgba(0,0,0,.1);
  --red:#d6002f;--red2:#b80027;--red3:rgba(255,0,60,.08);--redg:0 0 24px rgba(255,0,60,.18);
  --w:#16140f;--w80:#3a372f;--w60:#6b675e;--w35:#9b968b;--w10:#e4e1da;
  --green:#087952;--green-bg:rgba(10,157,110,.1);
  --amber:#a25e00;--amber-bg:rgba(201,119,0,.1);
  --blue:#2266dd;--blue-bg:rgba(34,102,221,.1);
  --purple:#6d3fd6;--purple-bg:rgba(109,63,214,.1);
  --sheet-handle:rgba(0,0,0,.18);
  --shadow-card:0 1px 2px rgba(20,15,5,.04),0 8px 24px -8px rgba(20,15,5,.1);
  --shadow-float:0 4px 16px rgba(20,15,5,.06),0 16px 36px -12px rgba(20,15,5,.14);
  --shadow-sheet:0 -8px 40px rgba(20,15,5,.16);
  --overlay:rgba(20,17,10,.35);
  --tile-bg:rgba(0,0,0,.035);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--w);font-family:var(--s);font-weight:400;font-size:16px;line-height:1.4;display:flex;flex-direction:column;transition:background .4s var(--ease),color .4s var(--ease);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.app-shell{flex:1;min-height:0;display:flex;flex-direction:column}
::-webkit-scrollbar{width:2px;height:2px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--red)}
::selection{background:var(--red);color:#fff}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ── TOP NAV ── */
.top-nav{height:var(--nav);background:var(--bg);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;position:relative;z-index:100;transition:background .4s var(--ease),border-color .4s var(--ease)}
.nav-logo{font-family:var(--d);font-size:1.5rem;letter-spacing:.08em}
.nav-logo em{color:var(--red);font-style:normal}
.nav-right{display:flex;align-items:center;gap:10px}
.live-badge{display:flex;align-items:center;gap:6px;font-family:var(--m);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green);background:var(--green-bg);border-radius:var(--r-pill);padding:6px 12px 6px 10px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 2s infinite}
@keyframes lp{0%,100%{box-shadow:0 0 0 0 rgba(0,196,140,.5)}50%{box-shadow:0 0 0 5px rgba(0,196,140,0)}}
.icon-btn{position:relative;background:var(--tile-bg);border:none;color:var(--w);cursor:pointer;width:38px;height:38px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:1.05rem;transition:transform .25s var(--spring),background .25s var(--ease)}
.icon-btn:active{transform:scale(.88)}
.notif-badge{position:absolute;top:-3px;right:-3px;width:18px;height:18px;background:var(--red);border-radius:50%;font-family:var(--m);font-size:.62rem;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 0 0 2px var(--bg)}
.notif-badge.hidden{display:none}
.theme-toggle{position:relative;width:52px;height:30px;border-radius:var(--r-pill);background:var(--tile-bg);border:none;cursor:pointer;flex-shrink:0;transition:background .3s var(--ease)}
.theme-toggle-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg5);color:var(--w);display:flex;align-items:center;justify-content:center;transition:transform .35s var(--spring),background .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none}
.theme-toggle-knob .icon{width:14px;height:14px}
.theme-toggle-knob .icon-sun{display:none}
:root[data-theme="light"] .theme-toggle-knob{transform:translateX(22px);background:#fff;color:var(--amber)}
:root[data-theme="light"] .theme-toggle-knob .icon-moon{display:none}
:root[data-theme="light"] .theme-toggle-knob .icon-sun{display:block}

/* ── MAIN CONTENT ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
/* FIX: cambiar de pestaña (Cotiz./Sesiones/Stats/Ajustes) era un corte
   seco — innerHTML se reemplazaba sin ninguna transición. Se agrega
   un fade + deslizamiento sutil, sin fill-mode "both/forwards" (que
   dejaría transform/opacity bloqueados para siempre después de la
   animación, un problema real que ya vimos en otro proyecto). */
@keyframes tabFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tab-content.animating{animation:tabFadeIn .32s cubic-bezier(.16,1,.3,1)}

/* ── BOTTOM DOCK (floating) ── */
.bottom-nav-wrap{position:relative;flex-shrink:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none;margin-top:-28px;z-index:100}
.bottom-nav{height:var(--bottom);background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--r-xl);display:flex;align-items:center;gap:4px;padding:6px;box-shadow:var(--shadow-float);pointer-events:all;transition:background .4s var(--ease),border-color .4s var(--ease)}
.bnav-item{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;border:none;background:none;border-radius:var(--r-lg);transition:background .35s var(--spring),transform .25s var(--spring);color:var(--w60)}
.bnav-item:active{transform:scale(.93)}
.bnav-item.active{background:var(--red);color:#fff;box-shadow:0 4px 14px -2px rgba(255,0,60,.5)}
.bnav-icon{font-size:1.15rem;line-height:1;transition:transform .3s var(--spring);filter:grayscale(1) brightness(.7)}
.bnav-item.active .bnav-icon{transform:translateY(-1px) scale(1.08);filter:none}
.lbl-l{display:none}
.bnav-label{font-family:var(--m);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:inherit;transition:color .2s}
.bnav-pip{position:absolute;top:4px;right:calc(50% - 18px);width:7px;height:7px;background:var(--red);border-radius:50%;display:none;box-shadow:0 0 0 2px var(--surface-raised)}
.bnav-item.active .bnav-pip{box-shadow:0 0 0 2px var(--red)}
.bnav-pip.show{display:block;animation:pipPulse 2s infinite}
@keyframes pipPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── SECTION PADDING ── */
.sp{padding:16px}

/* ── LOCK SCREEN ── */
#lockScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;transition:background .4s var(--ease),opacity .4s var(--ease),transform .4s var(--ease)}
#lockScreen.unlocking{opacity:0;transform:scale(1.04)}
.lock-logo{font-family:var(--d);font-size:3.5rem;letter-spacing:.1em;margin-bottom:4px;text-align:center}
.lock-logo em{color:var(--red);font-style:normal}
.lock-sub{font-family:var(--m);font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--w60);margin-bottom:48px;text-align:center}
.lock-title{font-family:var(--m);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:20px}
.pin-display{display:flex;gap:12px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--w35);background:transparent;transition:all .2s}
.pin-dot.filled{background:var(--red);border-color:var(--red);box-shadow:0 0 12px rgba(255,0,60,.5)}
.pin-dot.err{background:rgba(255,0,60,.3);border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:248px}
.pin-key{background:var(--surface);border:none;color:var(--w);font-family:var(--d);font-size:1.8rem;letter-spacing:.05em;height:66px;border-radius:var(--r-pill);cursor:pointer;transition:transform .15s var(--spring),background .2s var(--ease);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)}
.pin-key:active{background:var(--bg4);transform:scale(.93)}
.pin-key.del{font-family:var(--s);font-size:.85rem;color:var(--w60);box-shadow:none;background:none}
.pin-hint{font-family:var(--m);font-size:.7rem;color:var(--w60);letter-spacing:.15em;margin-top:28px;text-align:center}
.lock-line{position:absolute;background:rgba(255,0,60,.06)}
.lock-line-h{left:0;right:0;height:1px}
.lock-line-v{top:0;bottom:0;width:1px}

/* ── TOAST ── */
#toastWrap{position:fixed;bottom:calc(var(--bottom) + 18px);left:12px;right:12px;z-index:9998;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--surface-raised);border:1px solid var(--hairline);padding:13px 18px;font-size:.88rem;color:var(--w);display:flex;align-items:center;gap:9px;max-width:380px;width:100%;border-radius:var(--r-pill);animation:toastIn .45s var(--spring);box-shadow:var(--shadow-float)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
.toast.success{box-shadow:var(--shadow-float),inset 0 0 0 1px var(--green-bg)}.toast.warn{box-shadow:var(--shadow-float),inset 0 0 0 1px var(--amber-bg)}.toast.err{box-shadow:var(--shadow-float),inset 0 0 0 1px var(--red3)}

/* ── NOTIFICATION DRAWER (sheet from right, iOS style) ── */
#notifDrawer{position:fixed;top:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 16px));background:var(--surface-raised);border-radius:var(--r-xl);z-index:200;transform:translateX(calc(100% + 16px));transition:transform .5s var(--sheet-ease);overflow-y:auto;box-shadow:var(--shadow-float)}
#notifDrawer.open{transform:none}
.nd-head{padding:18px 20px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center}
.nd-title{font-family:var(--m);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--red)}
.nd-clear{font-family:var(--m);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--w60);background:var(--tile-bg);border:none;border-radius:var(--r-pill);cursor:pointer;padding:6px 12px;transition:color .2s}
.nd-clear:hover{color:var(--w)}
.nd-item{padding:14px 20px;border-bottom:1px solid var(--hairline);display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:background .2s}
.nd-item:hover{background:var(--tile-bg)}
.nd-item.unread{box-shadow:inset 3px 0 0 var(--red)}
.nd-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.nd-body{flex:1;min-width:0}
.nd-msg{font-size:.88rem;font-weight:500;color:var(--w);margin-bottom:3px;line-height:1.45}
.nd-time{font-family:var(--m);font-size:.66rem;color:var(--w60)}
.nd-empty{padding:40px 16px;text-align:center;font-family:var(--m);font-size:.7rem;color:var(--w60);letter-spacing:.2em;text-transform:uppercase}
.notif-overlay{position:fixed;inset:0;z-index:199;background:var(--overlay);display:none;backdrop-filter:blur(2px)}
.notif-overlay.show{display:block}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 8px}
.kpi{background:var(--surface);border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-card);transition:background .4s var(--ease)}
.kpi::before{content:'';position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%}
.kpi.red::before{background:var(--red)}.kpi.grn::before{background:var(--green)}.kpi.amb::before{background:var(--amber)}.kpi.blu::before{background:var(--blue)}
.kpi-lbl{font-family:var(--m);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--w60);margin-bottom:6px}
.kpi-val{font-family:var(--d);font-size:var(--fs-3xl);line-height:1;letter-spacing:.02em;color:var(--w)}
.kpi-val.red{color:var(--red)}.kpi-val.grn{color:var(--green)}.kpi-val.amb{color:var(--amber)}.kpi-val.blu{color:var(--blue)}
.kpi-val.money{font-size:var(--fs-2xl);padding-top:5px}
.kpi-sub{font-family:var(--m);font-size:.64rem;color:var(--w60);margin-top:5px}

/* ── QUOTE CARDS ── */
.section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px}
.section-head-title{font-family:var(--m);font-size:var(--fs-2xs);letter-spacing:.28em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px}
.section-head-title::before{content:'';width:14px;height:1px;background:var(--red)}
.filter-row{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{font-family:var(--m);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--tile-bg);border:none;border-radius:var(--r-pill);color:var(--w60);padding:9px 14px;cursor:pointer;white-space:nowrap;transition:all .25s var(--ease);flex-shrink:0;font-weight:600}
.filter-chip.active{color:#fff;background:var(--red);box-shadow:0 4px 12px -2px rgba(255,0,60,.45)}
.qcard{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin:0 16px 12px;transition:background .3s var(--ease),transform .2s var(--spring);box-shadow:var(--shadow-card);position:relative;cursor:pointer;display:flex;gap:13px}
.qcard:active{transform:scale(.985)}
@media(hover:hover){.qcard:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.3),0 16px 32px -10px rgba(0,0,0,.5);background:var(--surface2)}}
.qc-thumb{width:64px;height:64px;border-radius:var(--r-md);background:var(--tile-bg);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.4rem;position:relative}
.qc-thumb img{width:100%;height:100%;object-fit:cover}
.qc-thumb-count{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;font-family:var(--m);font-size:.62rem;padding:2px 5px;border-radius:var(--r-pill);line-height:1}
.qc-main{flex:1;min-width:0}
.qc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:8px}
.qc-id{font-family:var(--m);font-size:.7rem;letter-spacing:.08em;color:var(--w60);display:flex;align-items:center;gap:6px}
.qc-id::before{content:'';width:7px;height:7px;border-radius:50%;flex-shrink:0}
.qcard.pending .qc-id::before{background:var(--amber)}.qcard.approved .qc-id::before{background:var(--green)}.qcard.rejected .qc-id::before{background:var(--w35)}.qcard.done .qc-id::before{background:var(--blue)}
.qc-status{font-family:var(--m);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-pill);flex-shrink:0;font-weight:600}
.qc-status.pending{color:var(--amber);background:var(--amber-bg)}
.qc-status.approved{color:var(--green);background:var(--green-bg)}
.qc-status.rejected{color:var(--w60);background:var(--tile-bg)}
.qc-status.done{color:var(--blue);background:var(--blue-bg)}
.qc-name{font-size:var(--fs-lg);font-weight:700;margin-bottom:5px;color:var(--w);letter-spacing:-.01em}
.qc-meta{font-size:.84rem;color:var(--w60);margin-bottom:8px;line-height:1.4}
.qc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qtag{font-family:var(--m);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;background:var(--tile-bg);border-radius:var(--r-pill);color:var(--w60);font-weight:500}
.qtag.hi{color:var(--red);background:var(--red3)}
.qc-quick{display:flex;gap:8px}
.qc-quick .btn{padding:9px 14px;font-size:.68rem}
.empty-state{padding:56px 16px;text-align:center}
.empty-icon{font-size:2.62rem;margin-bottom:12px;opacity:.25}
.empty-txt{font-family:var(--m);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--w60)}

/* ── BUTTONS — pill shaped, higher contrast ── */
.btn{font-family:var(--s);font-size:.78rem;letter-spacing:0;border:none;padding:11px 18px;border-radius:var(--r-pill);cursor:pointer;transition:transform .2s var(--spring),background .2s var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-weight:600}
.btn:active{transform:scale(.94)}
.btn-approve{color:#003320;background:var(--green)}.btn-approve:hover{background:#00e0a0}
.btn-reject{color:var(--red);background:var(--red3)}.btn-reject:hover{background:rgba(255,0,60,.18)}
.btn-wa{color:var(--w);background:var(--tile-bg)}.btn-wa:hover{background:var(--bg5)}
.btn-dep{color:var(--blue);background:var(--blue-bg)}.btn-dep:hover{background:rgba(79,158,255,.2)}
.btn-done{color:var(--w60);background:var(--tile-bg)}.btn-done:hover{color:var(--w)}
.approve-form{display:none;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline)}
.approve-form.show{display:flex;animation:fadeUp .3s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
.apf-row{display:flex;gap:6px}
.finp{background:var(--tile-bg);border:1.5px solid transparent;color:var(--w);font-family:var(--s);font-size:1rem;padding:12px 15px;border-radius:var(--r-md);outline:none;width:100%;transition:border-color .2s var(--ease),background .2s var(--ease)}
.finp:focus{border-color:var(--red);background:var(--surface)}
.finp::placeholder{color:var(--w35)}

/* ── SESSIONS / CALENDAR ── */
.sessions-list{padding:0}
.sess-card{background:var(--surface);border-radius:var(--r-lg);padding:15px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start;cursor:pointer;transition:transform .2s var(--spring),background .3s var(--ease);box-shadow:var(--shadow-card)}
.sess-card:active{transform:scale(.985)}
@media(hover:hover){.sess-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.3),0 16px 32px -10px rgba(0,0,0,.5);background:var(--surface2)}}
.sess-date-box{background:var(--tile-bg);border-radius:var(--r-md);padding:8px 11px;text-align:center;min-width:50px;flex-shrink:0}
.sess-day{font-family:var(--d);font-size:1.5rem;line-height:1;color:var(--red)}
.sess-month{font-family:var(--m);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--w60)}
.sess-body{flex:1;min-width:0}
.sess-time{font-family:var(--s);font-size:.78rem;font-weight:500;color:var(--w60);margin-bottom:4px}
.sess-name{font-size:var(--fs-lg);font-weight:700;margin-bottom:3px;color:var(--w)}
.sess-style{font-family:var(--m);font-size:.66rem;color:var(--red);letter-spacing:.1em;text-transform:uppercase}
.sess-status{font-family:var(--m);font-size:.64rem;padding:5px 10px;border-radius:var(--r-pill);margin-left:auto;flex-shrink:0;align-self:flex-start}
.sess-status.upcoming{color:var(--amber);background:var(--amber-bg)}
.sess-status.done{color:var(--green);background:var(--green-bg)}
.sess-status.cancelled{color:var(--w60);background:var(--tile-bg)}
.add-sess-btn{width:100%;margin:0 0 12px;padding:14px;background:var(--tile-bg);border:1.5px dashed var(--hairline2);border-radius:var(--r-pill);color:var(--w60);font-family:var(--m);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .25s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}
.add-sess-btn:active{transform:scale(.97)}
.add-sess-btn:hover{border-color:var(--red);color:var(--red)}
/* ── BARRA DE NAVEGACIÓN DEL CALENDARIO (Hoy · ‹ › · rango) ── */
.cal-bar{display:flex;align-items:center;gap:8px;padding:14px 16px 12px}
.cal-today{font-family:var(--s);font-size:.82rem;font-weight:700;color:var(--red);background:var(--red3);border:none;border-radius:var(--r-pill);padding:9px 16px;cursor:pointer;transition:transform .2s var(--spring),background .2s var(--ease)}
.cal-today:active{transform:scale(.95)}
@media(hover:hover){.cal-today:hover{background:rgba(255,0,60,.16)}}
.cal-arrow{width:34px;height:34px;border-radius:50%;background:var(--tile-bg);border:none;color:var(--w);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s var(--ease),transform .2s var(--spring)}
.cal-arrow:active{transform:scale(.9)}
@media(hover:hover){.cal-arrow:hover{background:var(--bg5)}}
.cal-arrow .icon{width:14px;height:14px}
.cal-range{flex:1;text-align:right;font-size:.95rem;font-weight:700;color:var(--w);line-height:1.25}
.cal-range small{display:block;font-family:var(--m);font-size:.62rem;color:var(--w60);font-weight:400;letter-spacing:.1em;text-transform:uppercase}

/* ── LAYOUT: lateral (mini-cal + filtros) / principal (sesiones) ── */
.cal-layout{padding:0 16px}

/* ── MINI CALENDARIO MENSUAL ── */
.mini-cal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:14px;margin:0 0 12px}
.mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px}
.mc-title{font-size:.98rem;font-weight:700;color:var(--w)}
.mc-title span{color:var(--w60);font-weight:500}
.mc-nav{display:flex;gap:6px}
.mc-nav .cal-arrow{width:30px;height:30px}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mc-dow{font-family:var(--m);font-size:.6rem;color:var(--w60);text-align:center;padding:6px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.mc-day{position:relative;aspect-ratio:1;border:none;background:none;border-radius:11px;color:var(--w);font-family:var(--s);font-size:.88rem;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .2s var(--ease),transform .15s var(--spring);padding:0}
.mc-day:active{transform:scale(.9)}
@media(hover:hover){.mc-day:hover{background:var(--tile-bg)}}
.mc-day.out{color:var(--w35)}
.mc-day.today{box-shadow:inset 0 0 0 1.5px var(--red)}
.mc-day.sel{background:var(--red);color:#fff;box-shadow:0 4px 12px -2px rgba(255,0,60,.45)}
.mc-dots{display:flex;gap:2px;height:4px}
.mc-dot{width:4px;height:4px;border-radius:50%}
.mc-day.sel .mc-dot{background:#fff!important}

/* ── FILTROS "MIS CALENDARIOS" (por estilo) ── */
.cal-filters{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:14px 16px;margin:0 0 12px}
.cf-title{font-size:.95rem;font-weight:700;color:var(--w);margin-bottom:8px}
.cf-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.cf-item{display:flex;align-items:center;gap:9px;background:none;border:none;padding:7px 2px;cursor:pointer;color:var(--w80);font-family:var(--s);font-size:.85rem;font-weight:500;border-radius:8px;text-align:left;transition:color .2s var(--ease)}
.cf-item[aria-checked="false"]{color:var(--w35)}
.cf-box{width:19px;height:19px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--hairline2);background:transparent;transition:all .2s var(--ease)}
.cf-item[aria-checked="true"] .cf-box{border-color:transparent}
.cf-box .icon{width:12px;height:12px;stroke-width:3.2;color:var(--surface);opacity:0;transition:opacity .15s}
.cf-item[aria-checked="true"] .cf-box .icon{opacity:1}

/* ── SUB-TABS (within Sessions) ── */
.subtab-row{display:flex;gap:8px;padding:16px 16px 4px}
.subtab-chip{flex:1;font-family:var(--s);font-size:.82rem;font-weight:600;background:var(--tile-bg);border:none;border-radius:var(--r-pill);color:var(--w60);padding:11px 14px;cursor:pointer;transition:all .25s var(--ease);text-align:center}
.subtab-chip.active{color:#fff;background:var(--red);box-shadow:0 4px 12px -2px rgba(255,0,60,.45)}

/* ── AVAILABILITY ── */
.avail-intro{padding:8px 16px 4px}
.avail-intro-txt{font-size:.86rem;color:var(--w60);line-height:1.5}
.avail-share-btn{width:100%;justify-content:center;margin-top:10px}
.avail-days{padding:8px 16px}
.avail-day-card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-card)}
.avail-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.avail-day-lbl{font-size:1.02rem;font-weight:700;color:var(--w)}
.avail-add-btn{font-family:var(--s);font-size:.74rem;font-weight:600;background:var(--green-bg);color:var(--green);border:none;border-radius:var(--r-pill);padding:8px 13px;cursor:pointer;transition:transform .2s var(--spring);white-space:nowrap}
.avail-add-btn:active{transform:scale(.93)}
.avail-slots{display:flex;flex-wrap:wrap;gap:8px}
.avail-slot{display:flex;align-items:center;gap:8px;background:var(--tile-bg);border-radius:var(--r-pill);padding:8px 8px 8px 14px}
.avail-slot-time{font-size:.86rem;font-weight:600;color:var(--w)}
.avail-slot-label{font-family:var(--m);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red);background:var(--red3);padding:3px 8px;border-radius:var(--r-pill)}
.avail-slot-rm{width:22px;height:22px;border-radius:50%;border:none;background:var(--bg5);color:var(--w60);font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avail-day-empty{font-size:.82rem;color:var(--w60);font-style:italic}
.slot-date-display{font-size:1.05rem;font-weight:700;color:var(--w);background:var(--tile-bg);padding:12px 15px;border-radius:var(--r-md)}

/* ── SHARE CARD PREVIEW ── */
.share-card{background:linear-gradient(160deg,#0c0c0c,#080808);border-radius:var(--r-lg);padding:28px 22px;margin:4px 0 18px;position:relative;overflow:hidden;box-shadow:var(--shadow-card)}
.share-card-logo{font-family:var(--d);font-size:1.6rem;letter-spacing:.08em;color:#f0ede8;margin-bottom:18px}
.share-card-logo em{color:var(--red);font-style:normal}
.share-card-title{font-family:var(--s);font-weight:700;font-size:1.7rem;color:#f0ede8;line-height:1.15;margin-bottom:18px}
.share-day-row{margin-bottom:16px}
.share-day-name{font-family:var(--s);font-weight:700;font-size:1rem;color:var(--red);margin-bottom:8px}
.share-day-slots{display:flex;flex-wrap:wrap;gap:8px}
.share-slot-pill{background:rgba(255,255,255,.07);color:#f0ede8;font-size:.82rem;font-weight:600;padding:8px 13px;border-radius:var(--r-pill)}
.share-card-footer{font-size:.84rem;color:rgba(240,237,232,.55);margin-top:6px}

/* ── STATS ── */
.stats-wrap{padding:0 16px}
.stat-card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:10px;position:relative;box-shadow:var(--shadow-card)}
.stat-card::before{content:'';position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%}
.stat-card.red::before{background:var(--red)}.stat-card.grn::before{background:var(--green)}.stat-card.amb::before{background:var(--amber)}
.sc-lbl{font-family:var(--m);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--w60);margin-bottom:6px}
.sc-val{font-family:var(--d);font-size:2.4rem;letter-spacing:.03em;margin-bottom:2px;color:var(--w)}
.sc-sub{font-family:var(--m);font-size:.65rem;color:var(--green)}
.chart-card{background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-bottom:10px;box-shadow:var(--shadow-card)}
.chart-lbl{font-family:var(--m);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--w60);margin-bottom:18px}
.bars{display:flex;gap:8px;height:90px;align-items:flex-end}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar-fill{background:var(--red);width:100%;min-height:3px;border-radius:6px 6px 2px 2px;transition:height .6s var(--ease);position:relative;cursor:default}
.bar-fill:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--m);font-size:.65rem;color:var(--w);white-space:nowrap;background:var(--surface-raised);padding:4px 8px;margin-bottom:6px;border-radius:var(--r-sm);box-shadow:var(--shadow-card)}
.bar-lbl{font-family:var(--m);font-size:.64rem;color:var(--w60)}
.style-rows{display:flex;flex-direction:column;gap:12px}
.style-row{display:flex;align-items:center;gap:10px}
.style-name{font-family:var(--m);font-size:.68rem;color:var(--w60);width:82px;flex-shrink:0}
.style-bar-wrap{flex:1;height:6px;background:var(--tile-bg);border-radius:var(--r-pill);position:relative}
.style-bar-fill{height:100%;background:var(--red);border-radius:var(--r-pill);transition:width .8s var(--ease)}
.style-pct{font-family:var(--d);font-size:.9rem;color:var(--w);width:34px;text-align:right;flex-shrink:0}

/* ── SETTINGS ── */
.settings-wrap{padding:0 16px}
.settings-section{margin-bottom:22px;background:var(--surface);border-radius:var(--r-lg);padding:6px 16px;box-shadow:var(--shadow-card)}
.settings-sec-title{font-family:var(--m);font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--red);padding:14px 0 10px;display:flex;align-items:center;gap:8px}
.settings-sec-title::before{content:'';width:10px;height:1px;background:var(--red)}
.field-group{margin-bottom:12px}
.settings-section .field-group:last-child{margin-bottom:6px}
.field-label{font-family:var(--m);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--w60);margin-bottom:7px;display:block}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--hairline)}
.settings-section .setting-row:last-child{border-bottom:none}
.sr-left{flex:1;min-width:0}
.sr-title{font-size:.95rem;font-weight:600;margin-bottom:3px;color:var(--w)}
.sr-sub{font-family:var(--s);font-size:.78rem;color:var(--w60);line-height:1.45}
.toggle{width:48px;height:28px;border-radius:var(--r-pill);background:var(--tile-bg);border:none;cursor:pointer;position:relative;transition:background .3s var(--ease);flex-shrink:0;margin-left:12px}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.save-btn{width:100%;padding:15px;background:var(--red);border:none;border-radius:var(--r-pill);color:#fff;font-family:var(--m);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:18px;transition:transform .2s var(--spring),background .2s var(--ease);font-weight:600;box-shadow:0 6px 18px -4px rgba(255,0,60,.5)}
.save-btn:active{transform:scale(.97)}
@media(hover:hover){.save-btn:hover{background:var(--red2);transform:translateY(-1px)}}
.export-btn{width:100%;padding:13px;background:var(--tile-bg);border:none;border-radius:var(--r-pill);color:var(--w60);font-family:var(--m);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-bottom:9px;transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px}
.export-btn:active{transform:scale(.97)}
.export-btn:hover{color:var(--w);background:var(--bg5)}

/* ── BOTTOM SHEET (AirPods-connect style) ── */
.modal-overlay{position:fixed;inset:0;z-index:500;background:var(--overlay);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface-raised);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:8px 22px calc(28px + env(safe-area-inset-bottom,0px));position:relative;border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(100%);transition:transform .5s var(--sheet-ease);box-shadow:var(--shadow-sheet);touch-action:none}
.modal-overlay.open .modal{transform:translateY(0)}
.modal.dragging{transition:none}
.modal-handle{width:36px;height:5px;border-radius:var(--r-pill);background:var(--sheet-handle);margin:0 auto 18px;cursor:grab}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-family:var(--d);font-size:1.6rem;letter-spacing:.05em;color:var(--w)}
.modal-close{background:var(--tile-bg);border:none;border-radius:var(--r-pill);color:var(--w60);font-family:var(--m);font-size:.66rem;letter-spacing:.1em;padding:7px 13px;cursor:pointer;transition:all .2s var(--ease)}
.modal-close:hover{color:var(--w);background:var(--bg5)}
.modal-field{margin-bottom:14px}
.modal-label{font-family:var(--m);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--w60);margin-bottom:7px;display:block}
.modal-select{background:var(--tile-bg);border:1.5px solid transparent;color:var(--w);font-family:var(--s);font-size:.95rem;padding:11px 14px;border-radius:var(--r-md);width:100%;outline:none;transition:border-color .2s var(--ease)}
.modal-select:focus{border-color:var(--red)}
.modal-row{display:flex;gap:8px}
.modal-actions{display:flex;gap:8px;margin-top:22px}
.pin-notice{font-family:var(--m);font-size:.68rem;color:var(--w60);text-align:center;margin-top:16px;letter-spacing:.1em}

/* ── QUOTE DETAIL SHEET ── */
.qd-photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.qd-photos.single{grid-template-columns:1fr}
.qd-photo{aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;background:var(--tile-bg);cursor:zoom-in}
.qd-photo img{width:100%;height:100%;object-fit:cover}
.qd-status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.qd-id{font-family:var(--m);font-size:.7rem;letter-spacing:.1em;color:var(--w60)}
.qd-section{margin-bottom:20px}
.qd-section-lbl{font-family:var(--m);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:10px;font-weight:600}
.qd-name{font-family:var(--d);font-size:var(--fs-3xl);letter-spacing:.02em;color:var(--w);margin-bottom:4px;line-height:1}
.qd-contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qd-contact-card{background:var(--tile-bg);border-radius:var(--r-md);padding:13px 14px;text-decoration:none;display:flex;flex-direction:column;gap:2px;transition:background .2s var(--ease)}
.qd-contact-card:active{background:var(--bg5)}
.qd-contact-lbl{font-family:var(--m);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--w60)}
.qd-contact-val{font-size:.98rem;font-weight:600;color:var(--w)}
.qd-contact-card.wa .qd-contact-val{color:var(--green)}
.qd-facts{display:flex;flex-wrap:wrap;gap:8px}
.qd-fact{background:var(--tile-bg);border-radius:var(--r-pill);padding:9px 15px;font-size:.88rem;font-weight:600;color:var(--w)}
.qd-fact.hi{color:var(--red);background:var(--red3)}
.qd-concept-box{background:var(--tile-bg);border-radius:var(--r-md);padding:16px;font-size:1rem;line-height:1.65;color:var(--w80)}
.qd-price-box{background:var(--green-bg);border-radius:var(--r-md);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.qd-price-lbl{font-family:var(--m);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.qd-price-val{font-family:var(--d);font-size:1.8rem;color:var(--green)}
.qd-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.qd-actions .btn{justify-content:center;width:100%;padding:15px;font-size:.92rem}
.qd-actions-row{display:flex;gap:10px}
.qd-actions-row .btn{flex:1}

/* Lightbox for photo zoom */
#qdLightbox{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px}
#qdLightbox.open{display:flex}
#qdLightbox img{max-width:100%;max-height:100%;border-radius:var(--r-md);object-fit:contain}

/* ── CONFIRM DIALOG (replaces native confirm()) ── */
#confirmOverlay{position:fixed;inset:0;z-index:900;background:var(--overlay);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
#confirmOverlay.open{opacity:1;pointer-events:all}
.confirm-box{background:var(--surface-raised);border-radius:var(--r-xl);padding:28px 24px 20px;width:100%;max-width:340px;box-shadow:var(--shadow-float);transform:scale(.93) translateY(8px);transition:transform .3s var(--spring);text-align:center}
#confirmOverlay.open .confirm-box{transform:scale(1) translateY(0)}
.confirm-icon{font-size:1.6rem;margin-bottom:12px;line-height:1;color:var(--red);display:flex;justify-content:center}
.confirm-title{font-family:var(--s);font-size:1.08rem;font-weight:700;color:var(--w);margin-bottom:8px;line-height:1.3}
.confirm-body{font-size:.86rem;color:var(--w60);line-height:1.55;margin-bottom:22px}
.confirm-actions{display:flex;flex-direction:column;gap:9px}
.confirm-btn-ok{font-family:var(--s);font-size:.9rem;font-weight:700;border:none;border-radius:var(--r-pill);padding:14px;cursor:pointer;transition:transform .2s var(--spring),background .2s var(--ease);width:100%}
.confirm-btn-ok:active{transform:scale(.96)}
.confirm-btn-ok.danger{background:var(--red);color:#fff;box-shadow:0 4px 14px -2px rgba(255,0,60,.45)}
.confirm-btn-ok.danger:hover{background:#ff1a4f}
.confirm-btn-cancel{font-family:var(--s);font-size:.9rem;font-weight:600;border:none;border-radius:var(--r-pill);padding:14px;cursor:pointer;background:var(--tile-bg);color:var(--w60);width:100%;transition:background .2s var(--ease)}
.confirm-btn-cancel:hover{background:var(--bg5);color:var(--w)}

/* ── PULL INDICATOR ── */
.pull-ind{display:flex;align-items:center;justify-content:center;padding:10px 0;gap:8px;font-family:var(--m);font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--w60)}
.pull-spinner{width:12px;height:12px;border:1.5px solid var(--hairline2);border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite;display:none}
.pull-spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SCROLLABLE AREA PADDING ── */
.scroll-bottom-pad{height:16px}

/* ══════════════════════════════════════════════════════
   ESCRITORIO (≥860px) — layout propio, no la vista mobile angostada
   FIX v2: la primera pasada solo centraba la columna mobile en medio
   de la pantalla, dejando franjas vacías a los costados — se seguía
   viendo "una app de celular estirada", no un panel de escritorio.
   Ahora: menú lateral fijo (reutiliza los mismos botones/IDs de la
   navegación inferior, solo cambia cómo se VEN — el JS no se toca),
   y el contenido usa el ancho real disponible con grillas de
   tarjetas en vez de una columna angosta y única.
   ══════════════════════════════════════════════════════ */
@media(min-width:860px){
  body{background:var(--bg2)}
  .top-nav{background:var(--bg2);padding:0 28px}
  #lockScreen{background:var(--bg2)}

  .app-shell{display:flex;flex-direction:row;flex:1;min-height:0}
  .main{flex:1;min-width:0;background:var(--bg)}
  .tab-content{max-width:1180px;margin:0 auto;padding:28px 32px 40px}

  /* ── Menú lateral (mismos botones de siempre, reordenados) ──
     FIX v3: la v2 solo acomodaba los botones en columna, sin ningún
     tratamiento visual propio — se veía como una lista de links, no
     como un panel premium. Ahora cada ícono vive en su propia
     "insignia" redondeada, y el estado activo se marca con un
     relleno de color sólido (mismo lenguaje que las referencias:
     Linear/Stripe/dashboards modernos usan esta insignia+color
     como indicador de sección activa, no solo un cambio de texto). */
  .bottom-nav-wrap{
    order:-1;position:static;flex-shrink:0;width:240px;height:auto;
    margin:0;padding:24px 16px;background:var(--bg2);
    border-right:1px solid var(--hairline);pointer-events:all;
    display:flex;flex-direction:column;gap:28px;
  }
  .sidebar-mark{
    display:flex!important;align-items:center;gap:10px;padding:0 8px;
    font-family:var(--d);font-size:1.3rem;letter-spacing:.03em;color:var(--w);
  }
  .sidebar-mark-badge{
    width:34px;height:34px;border-radius:var(--r-md);background:var(--red);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 4px 14px -2px rgba(255,0,60,.5);
  }
  .sidebar-mark-badge svg{width:18px;height:18px;color:#fff}
  .bottom-nav{
    height:auto;flex-direction:column;align-items:stretch;gap:4px;
    background:none;border:none;box-shadow:none;padding:0;
  }
  .bnav-item{
    flex-direction:row;justify-content:flex-start;gap:12px;
    height:48px;padding:0 10px;border-radius:var(--r-md);
  }
  .bnav-item:hover{background:var(--tile-bg)}
  .bnav-item.active{background:none;box-shadow:none}
  .bnav-item.active:hover{background:none}
  .bnav-icon{
    transform:none!important;width:32px;height:32px;flex-shrink:0;
    border-radius:var(--r-md);background:var(--tile-bg);
    display:flex;align-items:center;justify-content:center;
    transition:background .3s var(--ease),color .3s var(--ease);
  }
  .bnav-item.active .bnav-icon{background:var(--red);color:#fff;box-shadow:0 4px 14px -2px rgba(255,0,60,.5)}
  .bnav-label{font-family:var(--s);font-size:.86rem;font-weight:600;letter-spacing:0;text-transform:none;transition:color .2s var(--ease)}
  .bnav-item.active .bnav-label{color:var(--w)}
  .bnav-pip{top:6px;left:34px;right:auto}

  /* ── Un solo eje de alineación: las secciones internas pierden su padding
     horizontal propio porque .tab-content ya acolcha el contenido ── */
  .section-head,.filter-row,.subtab-row,.avail-intro,.avail-days,.week-strip,.sessions-list{padding-left:0;padding-right:0}
  .sp{padding-left:0;padding-right:0}
  .add-sess-btn{width:100%;margin-left:0;margin-right:0}
  .qcard{margin-left:0;margin-right:0}
  #toastWrap{bottom:24px}
  .nav-logo{display:none}
  .top-nav{justify-content:flex-end}
  .lbl-s{display:none}
  .lbl-l{display:inline}

  /* ── KPIs: fila completa, no una grilla apretada de 2 ── */
  .kpi-grid{grid-template-columns:repeat(4,1fr);padding:0 0 20px}
  .kpi{padding:20px}
  .kpi-val{font-size:2.6rem}

  /* ── Cotizaciones y sesiones: grilla real, no una columna sola ── */
  .qcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .qcard{margin:0}
  .sessions-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start}
  .sess-card{margin:0}

  /* ── Agenda: lateral fijo (mini-cal + calendarios) + lista de sesiones ── */
  .cal-bar{padding:0 0 16px}
  .cal-layout{padding:0;display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
  .cal-side{position:sticky;top:0}
  .cf-list{grid-template-columns:1fr}

  /* ── Disponibilidad: 2 columnas de días + botón de ancho natural ── */
  .avail-days{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .avail-day-card{margin-bottom:0}
  .avail-share-btn{width:auto;min-width:320px}

  /* ── Stats: los 3 charts uno al lado del otro, no apilados ── */
  .stats-wrap{padding:0;display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
  .stats-wrap .chart-card:first-child{grid-column:1/-1}

  /* ── Ajustes: los campos de una sección en 2 columnas ── */
  .settings-wrap{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .settings-section:first-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
  .settings-section:first-child .settings-sec-title{grid-column:1/-1}
  .save-btn{grid-column:1/-1;width:auto;min-width:260px;justify-self:start}

  .export-btn{width:auto;min-width:220px}

  /* ── Filas de acción en la tarjeta de detalle ── */
  .qd-actions{flex-direction:column}
  .qd-actions-row{display:flex;gap:10px}
  .qd-actions-row .btn{flex:1}

  /* ── Modales: diálogo centrado, no hoja anclada abajo ── */
  .modal-overlay{align-items:center;padding:24px}
  .modal{border-radius:var(--r-xl);max-height:85vh;max-width:560px}
  .modal-handle{display:none}
}

@media(min-width:1300px){
  .kpi-grid{grid-template-columns:repeat(4,minmax(0,240px))}
}

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS & STORAGE KEY (must match ale.html's logic)
// ═══════════════════════════════════════════════════════
// Pega aquí la MISMA URL que en index.html (ver README-INSTALACION.txt)
const ALEINK_API_URL = 'https://script.google.com/macros/s/AKfycbyZfIy-svbLtbLEjv4gvdxB_LejI_HR4eva35sr2D32yl-_TxiLAywiOTDM0dsi_KbOiw/exec';
const STORAGE_KEY = 'aleink_quotes';
const SESSIONS_KEY = 'aleink_sessions';
const NOTIFS_KEY = 'aleink_notifs';
const SETTINGS_KEY = 'aleink_settings';
const PIN_KEY = 'aleink_pin';
const AVAIL_KEY = 'aleink_availability';

const STYLES_MAP = {
  BLACKWORK:'Blackwork',FINE_LINE:'Fine Line',REALISMO:'Realismo',
  GEOMETRICO:'Geométrico',TRADITIONAL:'Traditional',WATERCOLOR:'Watercolor'
};

const STYLE_COLORS = {
  BLACKWORK:'var(--w)', FINE_LINE:'var(--blue)', REALISMO:'var(--red)',
  GEOMETRICO:'var(--amber)', TRADITIONAL:'var(--green)', WATERCOLOR:'var(--purple)'
};



const DEFAULT_QUOTES = [
  {id:'Q-001',name:'Camila F.',ig:'@camila.fb',wa:'+56 9 1234 5678',date:'2025-06-12',style:'REALISMO',zone:'Brazo completo',w:25,h:35,flash:'',concept:'Retrato felino realista, estilo blanco y negro con sombreado suave.',status:'pending',price:null,deposit:null},
  {id:'Q-002',name:'Valentina M.',ig:'@vale.morales',wa:'+56 9 8765 4321',date:'2025-06-14',style:'BLACKWORK',zone:'Antebrazo',w:12,h:18,flash:'',concept:'Lobo geométrico minimalista, líneas finas y patrones triangulares.',status:'approved',price:90000,deposit:18000},
  {id:'Q-003',name:'Diego F.',ig:'@diego.f',wa:'+56 9 5555 1212',date:'2025-06-09',style:'BLACKWORK',zone:'Pecho',w:20,h:20,flash:'',concept:'Cover-up de tatuaje antiguo, diseño blackwork denso.',status:'done',price:160000,deposit:32000},
];

const DEFAULT_SESSIONS = [
  {id:'S-001',name:'Camila F.',date:'2025-06-17',time:'10:00',style:'REALISMO',zone:'Brazo completo',dur:4,price:185000,notes:'Retrato felino. Primera sesión de sleeve.',status:'upcoming'},
  {id:'S-002',name:'Valentina M.',date:'2025-06-19',time:'14:00',style:'BLACKWORK',zone:'Antebrazo',dur:3,price:90000,notes:'Lobo geométrico. Abono recibido.',status:'upcoming'},
  {id:'S-003',name:'Diego F.',date:'2025-06-10',time:'11:00',style:'BLACKWORK',zone:'Pecho',dur:5,price:160000,notes:'Cover-up blackwork.',status:'done'},
];

const DEFAULT_SETTINGS = {
  wa:'+56 9 74369717',deposit:20,studioName:'ALE.INK',email:'ale@aleink.cl',
  reminder72:true,reminder24:true,aftercare:true,autoWA:true
};

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let QUOTES = [], SESSIONS = [], NOTIFICATIONS = [], SETTINGS = {...DEFAULT_SETTINGS}, AVAILABILITY = {};
let currentTab = 'quotes';
let quotesFilter = '';
let selectedWeekDay = null;
let editSessId = null;
let pinBuffer = '';
let unlocked = false;
let sessionsSubTab = 'agenda';

// ═══════════════════════════════════════════════════════
//  PIN SYSTEM
// ═══════════════════════════════════════════════════════
function getPin() { return localStorage.getItem(PIN_KEY) || '1234'; }

function pinPress(d) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += d;
  updatePinDots();
  if (pinBuffer.length === 4) {
    setTimeout(() => {
      if (pinBuffer === getPin()) {
        unlocked = true;
        const ls = document.getElementById('lockScreen');
        ls.classList.add('unlocking');
        sessionStorage.setItem('aleink_unlocked', '1');
        setTimeout(() => { ls.style.display = 'none'; }, 420);
        initApp();
      } else {
        document.querySelectorAll('.pin-dot').forEach(el => el.classList.add('err'));
        setTimeout(() => {
          document.querySelectorAll('.pin-dot').forEach(el => { el.classList.remove('err', 'filled'); });
          pinBuffer = '';
        }, 600);
      }
    }, 200);
  }
}

function pinDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('pd' + i);
    el.classList.toggle('filled', i < pinBuffer.length);
  }
  const st = document.getElementById('pinStatus');
  if (st) st.textContent = pinBuffer.length + ' de 4 dígitos ingresados';
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function initApp() {
  loadAll();
  renderTab();
  setupStorageListener();
  setupAutoRefresh();
  renderNotifList();
}

function loadAll() {
  // Load quotes — merge with localStorage (shared with main page)
  const raw = localStorage.getItem(STORAGE_KEY);
  QUOTES = raw ? JSON.parse(raw) : [...DEFAULT_QUOTES];
  if (!raw) saveQuotes();

  const sraw = localStorage.getItem(SESSIONS_KEY);
  SESSIONS = sraw ? JSON.parse(sraw) : [...DEFAULT_SESSIONS];
  if (!sraw) saveSessions();

  const nraw = localStorage.getItem(NOTIFS_KEY);
  NOTIFICATIONS = nraw ? JSON.parse(nraw) : [];

  const straw = localStorage.getItem(SETTINGS_KEY);
  SETTINGS = straw ? {...DEFAULT_SETTINGS, ...JSON.parse(straw)} : {...DEFAULT_SETTINGS};

  const araw = localStorage.getItem(AVAIL_KEY);
  AVAILABILITY = araw ? JSON.parse(araw) : {};
}

function saveQuotes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(QUOTES)); }
function saveSessions() { localStorage.setItem(SESSIONS_KEY, JSON.stringify(SESSIONS)); pushStateToServer(); }
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); pushStateToServer(); }
function saveNotifs() { localStorage.setItem(NOTIFS_KEY, JSON.stringify(NOTIFICATIONS)); }
function saveAvailability() { localStorage.setItem(AVAIL_KEY, JSON.stringify(AVAILABILITY)); }

// ── Empuja un cambio de cotización al backend (se sincroniza a todos los dispositivos) ──
function pushQuoteToServer(quote) {
  if (!ALEINK_API_URL || !quote) return;
  try {
    fetch(ALEINK_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'update', quote })
    }).catch(() => {});
  } catch (e) {}
}

// ── Empuja sesiones + configuración al backend (estado compartido) ──
let _statePushTimer = null;
function pushStateToServer() {
  if (!ALEINK_API_URL) return;
  // Agrupa cambios rápidos en un solo envío (evita spamear el servidor)
  clearTimeout(_statePushTimer);
  _statePushTimer = setTimeout(() => {
    try {
      fetch(ALEINK_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'saveState', sessions: SESSIONS, settings: SETTINGS })
      }).catch(() => {});
    } catch (e) {}
  }, 600);
}


// ── Listen for changes from the main page ──
function setupStorageListener() {
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY && e.newValue) {
      const newQuotes = JSON.parse(e.newValue);
      const oldIds = new Set(QUOTES.map(q => q.id));
      const fresh = newQuotes.filter(q => !oldIds.has(q.id));
      if (fresh.length) {
        fresh.forEach(q => {
          addNotif(`<svg class="icon"><use href="#i-sparkle"></use></svg> Nueva cotización de ${q.name}`, `${STYLES_MAP[q.style] || q.style} · ${q.zone} · ${q.w}×${q.h}cm`, 'new');
        });
        QUOTES = newQuotes;
        showPulse();
        if (currentTab === 'quotes') renderTab();
      } else {
        QUOTES = newQuotes;
      }
    }
  });
}

// ── Poll every 5s as fallback (same-tab or mobile) ──
let lastSeen = '';
function setupAutoRefresh() {
  setInterval(() => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw && raw !== lastSeen) {
      lastSeen = raw;
      const newQ = JSON.parse(raw);
      const oldIds = new Set(QUOTES.map(q => q.id));
      const fresh = newQ.filter(q => !oldIds.has(q.id));
      if (fresh.length) {
        fresh.forEach(q => {
          addNotif(`<svg class="icon"><use href="#i-sparkle"></use></svg> Nueva cotización de ${q.name}`, `${STYLES_MAP[q.style] || q.style} · ${q.zone} · ${q.w}×${q.h}cm`, 'new');
        });
        QUOTES = newQ;
        showPulse();
        if (currentTab === 'quotes') renderTab();
        else updateBadges();
      } else {
        QUOTES = newQ;
      }
    }
  }, 3000);
  setInterval(syncFromServer, 5000);
  syncFromServer();
}

// ── Trae cotizaciones enviadas desde CUALQUIER dispositivo (Google Sheets) ──
async function syncFromServer(){
  if(!ALEINK_API_URL) return;
  try{
    const res = await fetch(ALEINK_API_URL);
    let serverQ = await res.json();
    if(!Array.isArray(serverQ)) return;
    // El backend (Google Sheets) puede devolver números o fechas donde
    // esperamos texto (ej. un WhatsApp "56974369717" llega como número).
    // Normalizamos los campos de texto a String para que el panel nunca
    // truene al hacer .replace() u otras operaciones de texto.
    serverQ = serverQ.map(q => ({
      ...q,
      id: q.id != null ? String(q.id) : q.id,
      name: q.name != null ? String(q.name) : '',
      ig: q.ig != null ? String(q.ig) : '',
      wa: q.wa != null ? String(q.wa) : '',
      concept: q.concept != null ? String(q.concept) : '',
      zone: q.zone != null ? String(q.zone) : '',
      style: q.style != null ? String(q.style) : '',
      status: q.status != null ? String(q.status) : 'pending'
    }));
    const oldIds = new Set(QUOTES.map(q=>q.id));
    const fresh = serverQ.filter(q=>q.id && !oldIds.has(q.id));
    const serverIds = new Set(serverQ.map(q=>q.id));
    const localOnly = QUOTES.filter(q=>!serverIds.has(q.id));
    QUOTES = [...serverQ, ...localOnly];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(QUOTES)); // guarda sin re-empujar al server
    if(fresh.length){
      fresh.forEach(q=>{
        addNotif(`<svg class="icon"><use href="#i-sparkle"></use></svg> Nueva cotización de ${q.name}`, `${STYLES_MAP[q.style]||q.style} · ${q.zone} · ${q.w}×${q.h}cm`, 'new');
      });
      showPulse();
      if(currentTab==='quotes') renderTab();
      else updateBadges();
    }
    // Trae sesiones + configuración compartidas (aprobar/agendar hecho en otro dispositivo)
    await syncStateFromServer();
  }catch(e){ /* sin conexión: sigue funcionando con localStorage */ }
}

// Lee sesiones + configuración compartidas desde el backend
async function syncStateFromServer(){
  if(!ALEINK_API_URL) return;
  try{
    const res = await fetch(ALEINK_API_URL + (ALEINK_API_URL.includes('?')?'&':'?') + 'state=1');
    const st = await res.json();
    if(!st || typeof st !== 'object') return;
    let changed = false;
    if(Array.isArray(st.sessions) && JSON.stringify(st.sessions) !== JSON.stringify(SESSIONS)){
      SESSIONS = st.sessions;
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(SESSIONS)); // sin re-empujar
      changed = true;
    }
    if(st.settings && Object.keys(st.settings).length){
      const merged = {...SETTINGS, ...st.settings};
      if(JSON.stringify(merged) !== JSON.stringify(SETTINGS)){
        SETTINGS = merged;
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); // sin re-empujar
        changed = true;
      }
    }
    if(changed && currentTab !== 'quotes'){ if(typeof renderTab==='function') renderTab(); }
    else if(changed){ updateBadges && updateBadges(); }
  }catch(e){}
}

function showPulse() {
  document.getElementById('pip-quotes').classList.add('show');
  toast(`¡Nueva cotización recibida!`, '<svg class="icon"><use href="#i-sparkle"></use></svg>', 'success');
}

// ═══════════════════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function addNotif(msg, sub, type) {
  NOTIFICATIONS.unshift({id: Date.now(), msg, sub, type, time: new Date().toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit'}), read: false});
  if (NOTIFICATIONS.length > 50) NOTIFICATIONS.pop();
  saveNotifs();
  updateBadges();
  renderNotifList();
}

function updateBadges() {
  const unread = NOTIFICATIONS.filter(n => !n.read).length;
  const badge = document.getElementById('notifBadge');
  if (unread > 0) {
    badge.textContent = unread > 9 ? '9+' : unread;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  const pending = QUOTES.filter(q => q.status === 'pending').length;
  const pip = document.getElementById('pip-quotes');
  if (pip) pip.classList.toggle('show', pending > 0);
}

function renderNotifList() {
  const el = document.getElementById('notifList');
  if (!el) return;
  if (!NOTIFICATIONS.length) {
    el.innerHTML = '<div class="nd-empty">Sin notificaciones</div>';
    return;
  }
  el.innerHTML = NOTIFICATIONS.map(n => `
    <div class="nd-item ${n.read ? '' : 'unread'}" onclick="markRead(${n.id})">
      <div class="nd-icon">${n.type === 'new' ? '<svg class="icon"><use href="#i-sparkle"></use></svg>' : n.type === 'approved' ? '<svg class="icon"><use href="#i-check-circle"></use></svg>' : '<svg class="icon"><use href="#i-bell"></use></svg>'}</div>
      <div class="nd-body">
        <div class="nd-msg">${n.msg}</div>
        ${n.sub ? `<div class="nd-msg" style="font-size:.75rem;color:var(--w60)">${n.sub}</div>` : ''}
        <div class="nd-time">${n.time}</div>
      </div>
    </div>`).join('');
}

function markRead(id) {
  const n = NOTIFICATIONS.find(x => x.id === id);
  if (n) { n.read = true; saveNotifs(); updateBadges(); renderNotifList(); }
}

function clearNotifs() {
  NOTIFICATIONS = [];
  saveNotifs();
  updateBadges();
  renderNotifList();
}

function toggleNotifDrawer() {
  document.getElementById('notifDrawer').classList.toggle('open');
  document.getElementById('notifOverlay').classList.toggle('show');
  NOTIFICATIONS.forEach(n => n.read = true);
  saveNotifs();
  updateBadges();
  renderNotifList();
}

function closeNotifDrawer() {
  document.getElementById('notifDrawer').classList.remove('open');
  document.getElementById('notifOverlay').classList.remove('show');
}

// ═══════════════════════════════════════════════════════
//  TAB ROUTING
// ═══════════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.bnav-item').forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-current'); });
  const btn = document.getElementById('btn-' + tab);
  btn.classList.add('active');
  btn.setAttribute('aria-current', 'page');
  if (tab === 'quotes') document.getElementById('pip-quotes').classList.remove('show');
  renderTab();
}

function renderTab() {
  const el = document.getElementById('mainContent');
  if (currentTab === 'quotes') el.innerHTML = buildQuotesTab();
  else if (currentTab === 'sessions') { el.innerHTML = buildSessionsTab(); if (sessionsSubTab === 'agenda') initMiniCal(); }
  else if (currentTab === 'stats') { el.innerHTML = buildStatsTab(); animBars(); }
  else if (currentTab === 'settings') el.innerHTML = buildSettingsTab();
  updateBadges();
  // Reinicia la transición de entrada en cada render (quitar+forzar
  // reflow+volver a poner la clase, porque solo tenerla puesta ya no
  // dispara la animación de nuevo si no cambia).
  el.classList.remove('animating');
  void el.offsetWidth;
  el.classList.add('animating');
}

// ═══════════════════════════════════════════════════════
//  QUOTES TAB
// ═══════════════════════════════════════════════════════
function buildQuotesTab() {
  const pending = QUOTES.filter(q => q.status === 'pending').length;
  const approved = QUOTES.filter(q => q.status === 'approved').length;
  const total = QUOTES.length;
  const rejectedN = QUOTES.filter(q => q.status === 'rejected').length;
  const dep = QUOTES.filter(q => q.deposit).reduce((s, q) => s + q.deposit, 0);

  let html = `
  <div class="kpi-grid">
    <div class="kpi amb"><div class="kpi-lbl">Pendientes</div><div class="kpi-val amb">${pending}</div><div class="kpi-sub">esperando respuesta</div></div>
    <div class="kpi grn"><div class="kpi-lbl">Aprobadas</div><div class="kpi-val grn">${approved}</div><div class="kpi-sub">confirmadas</div></div>
    <div class="kpi red"><div class="kpi-lbl">Total</div><div class="kpi-val">${total}</div><div class="kpi-sub">cotizaciones</div></div>
    <div class="kpi blu"><div class="kpi-lbl">Abonos</div><div class="kpi-val blu money">$${fmtK(dep)}</div><div class="kpi-sub">recibidos</div></div>
  </div>
  <div class="pull-ind"><div class="pull-spinner" id="pullSpinner"></div><span id="pullTxt">Actualización automática activa</span></div>
  <div class="section-head">
    <div class="section-head-title">Cotizaciones</div>
  </div>
  <div class="filter-row">
    <button class="filter-chip ${quotesFilter===''?'active':''}" aria-pressed="${quotesFilter===''}" onclick="setFilter('')">Todas · ${total}</button>
    <button class="filter-chip ${quotesFilter==='pending'?'active':''}" aria-pressed="${quotesFilter==='pending'}" onclick="setFilter('pending')">Pendientes · ${pending}</button>
    <button class="filter-chip ${quotesFilter==='approved'?'active':''}" aria-pressed="${quotesFilter==='approved'}" onclick="setFilter('approved')">Aprobadas · ${approved}</button>
    <button class="filter-chip ${quotesFilter==='rejected'?'active':''}" aria-pressed="${quotesFilter==='rejected'}" onclick="setFilter('rejected')">Rechazadas · ${rejectedN}</button>
  </div>`;

  const data = quotesFilter ? QUOTES.filter(q => q.status === quotesFilter) : QUOTES;

  if (!data.length) {
    html += `<div class="empty-state"><div class="empty-icon"><svg class="icon"><use href="#i-inbox"></use></svg></div><div class="empty-txt">Sin cotizaciones</div></div>`;
  } else {
    html += '<div class="qcard-grid">';
    data.forEach((q) => {
      const i = QUOTES.indexOf(q);
      const sn = STYLES_MAP[q.style] || q.style;
      const refs = q.refs || [];
      const thumb = refs.length
        ? `<img src="${refs[0]}" alt="ref"/>${refs.length > 1 ? `<div class="qc-thumb-count">+${refs.length - 1}</div>` : ''}`
        : '<svg class="icon"><use href="#i-palette"></use></svg>';
      html += `<div class="qcard ${q.status}" id="qc-${q.id}" data-quote-idx="${i}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openQuoteDetail(${i})}" tabindex="0" role="button" aria-label="Ver cotización de ${esc(q.name)}, ${statusLabel(q.status)}">
        <div class="qc-thumb">${thumb}</div>
        <div class="qc-main">
          <div class="qc-header">
            <div class="qc-id">${q.id} · ${q.date}</div>
            <div class="qc-status ${q.status}">${statusLabel(q.status)}</div>
          </div>
          <div class="qc-name">${esc(q.name)}</div>
          <div class="qc-meta">${sn} · ${esc(q.zone) || 'Sin zona'} · ${q.w}×${q.h}cm</div>
          <div class="qc-tags">
            ${q.flash ? `<span class="qtag hi"><svg class="icon"><use href="#i-hexagon"></use></svg> Flash</span>` : ''}
            ${q.price ? `<span class="qtag hi">$${fmtK(q.price)}</span>` : ''}
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  html += '<div class="scroll-bottom-pad"></div>';

}

function setFilter(f) { quotesFilter = f; renderTab(); }

function statusLabel(s) {
  return {pending:'Pendiente', approved:'Aprobada', rejected:'Rechazada', done:'Completada'}[s] || s;
}

function rejectQ(i) {
  showConfirm({
    icon: '<svg class="icon"><use href="#i-x"></use></svg>',
    title: '¿Rechazar cotización?',
    body: `La cotización de ${QUOTES[i].name} quedará marcada como rechazada. Esto no se puede deshacer.`,
    okLabel: 'Sí, rechazar',
    onOk: () => {
      QUOTES[i].status = 'rejected';
      saveQuotes();
      pushQuoteToServer(QUOTES[i]);
      toast('Cotización rechazada', '<svg class="icon"><use href="#i-x"></use></svg>');
      renderTab();
    }
  });
}

function cancelApprovedQ(i) {
  const q = QUOTES[i];
  const linkedSession = SESSIONS.find(s => s.name === q.name && s.status === 'upcoming');
  showConfirm({
    icon: '<svg class="icon"><use href="#i-phone-off"></use></svg>',
    title: 'Cliente se bajó',
    body: linkedSession
      ? `Se cancelará la cotización de ${q.name} y también la sesión agendada el ${linkedSession.date} a las ${linkedSession.time}. El horario quedará libre.`
      : `Se cancelará la cotización de ${q.name} y quedará marcada como rechazada.`,
    okLabel: 'Cancelar y liberar',
    onOk: () => {
      q.status = 'rejected';
      saveQuotes();
      pushQuoteToServer(q);
      if (linkedSession) {
        SESSIONS = SESSIONS.filter(s => s.id !== linkedSession.id);
        saveSessions();
      }
      toast(linkedSession ? 'Cotización cancelada · horario liberado' : 'Cotización cancelada', '<svg class="icon"><use href="#i-x"></use></svg>', 'warn');
      renderQuoteDetail();
      renderTab();
    }
  });
}

function deleteQuoteForever(i) {
  const q = QUOTES[i];
  showConfirm({
    icon: '<svg class="icon"><use href="#i-trash"></use></svg>',
    title: 'Eliminar definitivamente',
    body: `Se eliminará la cotización ${q.id} de ${q.name} sin dejar ningún registro. Esta acción no se puede deshacer.`,
    okLabel: 'Eliminar para siempre',
    onOk: () => {
      QUOTES.splice(i, 1);
      saveQuotes();
      closeQuoteModal();
      toast('Cotización eliminada', '<svg class="icon"><use href="#i-trash"></use></svg>', 'warn');
      renderTab();

  });
}

function markDone(i) {
  QUOTES[i].status = 'done';
  saveQuotes();
  pushQuoteToServer(QUOTES[i]);
  toast('Marcada como completada', '<svg class="icon"><use href="#i-check-circle"></use></svg>', 'success');
  renderTab();
}

function createSession(qid) {
  const q = QUOTES.find(x => x.id === qid);

  // Pre-fill session modal
  document.getElementById('sessName').value = q.name;

      <button class="add-sess-btn" onclick="openNewSess()"><svg class="icon"><use href="#i-plus"></use></svg> Nueva sesión</button>
      <div class="sessions-list" id="sessList">`;

  const base = selectedWeekDay ? SESSIONS.filter(s => s.date === selectedWeekDay) : [...upcoming, ...past];

  if (!toShow.length) {

// ── Mini calendario mensual ──
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let calCursor = null; // primer día del mes visible

function initMiniCal() {
  const el = document.getElementById('miniCal');
  if (!el) return;
  if (!calCursor) {
    const ref = selectedWeekDay ? new Date(selectedWeekDay + 'T12:00:00') : new Date();
    calCursor = new Date(ref.getFullYear(), ref.getMonth(), 1);
  }
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const todayStr = getTodayStr();

  // Sesiones por día (para los puntos de color, respetando filtros)
  const byDay = {};
  SESSIONS.forEach(s => {
    if (CAL_HIDDEN.has(s.style)) return;
    (byDay[s.date] = byDay[s.date] || []).push(s.style);
  });

  // Lunes como primer día de la semana
  const first = new Date(y, m, 1);
  const start = new Date(first);
  start.setDate(first.getDate() - ((first.getDay() + 6) % 7));

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const ds = localYMD(d);
    const out = d.getMonth() !== m;
    const styles = byDay[ds] || [];
    const dots = [...new Set(styles)].slice(0, 3)
      .map(st => `<span class="mc-dot" style="background:${STYLE_COLORS[st] || 'var(--red)'}"></span>`).join('');
    const cls = ['mc-day', out ? 'out' : '', ds === todayStr ? 'today' : '', ds === selectedWeekDay ? 'sel' : ''].filter(Boolean).join(' ');
    const aria = `${d.getDate()} de ${MONTHS_ES[d.getMonth()].toLowerCase()}${styles.length ? `, ${styles.length} ${styles.length === 1 ? 'sesión' : 'sesiones'}` : ''}`;
    cells += `<button class="${cls}" onclick="calSelectDay('${ds}')" aria-label="${aria}" aria-pressed="${ds === selectedWeekDay}"${ds === todayStr ? ' aria-current="date"' : ''}>${d.getDate()}<span class="mc-dots" aria-hidden="true">${dots}</span></button>`;
  }

  el.innerHTML = `
    <div class="mc-head">
      <div class="mc-title">${MONTHS_ES[m]} <span>${y}</span></div>
      <div class="mc-nav">
        <button class="cal-arrow" onclick="mcNav(-1)" aria-label="Mes anterior"><svg class="icon"><use href="#i-chev-l"></use></svg></button>
        <button class="cal-arrow" onclick="mcNav(1)" aria-label="Mes siguiente"><svg class="icon"><use href="#i-chev-r"></use></svg></button>
      </div>
    </div>
    <div class="mc-grid">
      ${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(d => `<div class="mc-dow">${d}</div>`).join('')}
      ${cells}
    </div>`;

  // Rango en la barra superior
  const range = document.getElementById('calRange');
  if (range) {
    if (selectedWeekDay) {
      const n = (SESSIONS.filter(s => s.date === selectedWeekDay && !CAL_HIDDEN.has(s.style))).length;
      range.innerHTML = `${dayLabel(selectedWeekDay)}<small>${n} ${n === 1 ? 'sesión' : 'sesiones'}</small>`;
    } else {
      const n = SESSIONS.filter(s => !CAL_HIDDEN.has(s.style)).length;
      range.innerHTML = `Todas las sesiones<small>${n} en total</small>`;
    }
  }
}

function mcNav(delta) {
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + delta, 1);
  initMiniCal();
}

function calSelectDay(ds) {
  selectedWeekDay = selectedWeekDay === ds ? null : ds;
  if (selectedWeekDay) {
    const d = new Date(ds + 'T12:00:00');
    calCursor = new Date(d.getFullYear(), d.getMonth(), 1);
  }
  renderTab();
}

function calShiftDay(delta) {
  const base = selectedWeekDay ? new Date(selectedWeekDay + 'T12:00:00') : new Date();
  base.setDate(base.getDate() + delta);
  selectedWeekDay = localYMD(base);
  calCursor = new Date(base.getFullYear(), base.getMonth(), 1);
  renderTab();
}

function calToday() {
  const t = new Date();
  selectedWeekDay = localYMD(t);
  calCursor = new Date(t.getFullYear(), t.getMonth(), 1);
  renderTab();
}

function toggleCalFilter(style) {

function nextDays(n) {
  const out = [];
  const today = new Date();
  for (let i = 0; i < n; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    out.push(localYMD(d));
  }
  return out;
}

function dayLabel(ds) {
  const d = new Date(ds + 'T12:00:00');
  const today = getTodayStr();
  const tomorrow = nextDays(2)[1];
  if (ds === today) return 'Hoy';
  if (ds === tomorrow) return 'Mañana';
  const wd = d.toLocaleDateString('es-CL', { weekday: 'long' });
  const md = d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }).replace('.', '');
  return `${wd.charAt(0).toUpperCase()}${wd.slice(1)} ${md}`;
}

function downloadShareCard() {
  const days = nextDays(7).filter(ds => (AVAILABILITY[ds] || []).length);
  if (!days.length) { toast('No hay horarios para compartir', '<svg class="icon"><use href="#i-alert-triangle"></use></svg>', 'warn'); return; }

  const W = 1080, H = 1920;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0c0c0c');
  grad.addColorStop(1, '#080808');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle red corner glow
  const glow = ctx.createRadialGradient(W * 0.85, H * 0.08, 10, W * 0.85, H * 0.08, 520);
  glow.addColorStop(0, 'rgba(255,0,60,.22)');
  glow.addColorStop(1, 'rgba(255,0,60,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Logo
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff003c';
  ctx.font = '700 64px "Space Grotesk", sans-serif';
  ctx.fillText('ALE', W / 2 - 70, 180);
  ctx.fillStyle = '#f0ede8';
  ctx.fillText('.INK', W / 2 + 70, 180);

  // Title
  ctx.font = '700 88px "Space Grotesk", sans-serif';
  ctx.fillStyle = '#f0ede8';
  ctx.fillText('Horarios disponibles', W / 2, 300);

  ctx.font = '400 34px "Space Grotesk", sans-serif';
  ctx.fillStyle = 'rgba(240,237,232,.6)';
  ctx.fillText('Escríbeme para agendar tu cita', W / 2, 360);

  // Day rows
  let y = 480;
  const rowGap = days.length > 5 ? 190 : 230;
  days.forEach(ds => {
    const slots = AVAILABILITY[ds].slice().sort((a, b) => a.start.localeCompare(b.start));
    ctx.textAlign = 'left';
    ctx.font = '700 52px "Space Grotesk", sans-serif';
    ctx.fillStyle = '#ff003c';
    ctx.fillText(dayLabel(ds), 90, y);

    let chipX = 90, chipY = y + 60;
    ctx.font = '600 38px "Space Grotesk", sans-serif';
    slots.forEach(s => {
      const label = `${s.start}${s.label ? ' · ' + s.label : ''}`;
      const textW = ctx.measureText(label).width;
      const chipW = textW + 56;
      if (chipX + chipW > W - 90) { chipX = 90; chipY += 76; }
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      roundRect(ctx, chipX, chipY, chipW, 64, 32);
      ctx.fill();
      ctx.fillStyle = '#f0ede8';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, chipX + 28, chipY + 33);
      ctx.textBaseline = 'alphabetic';
      chipX += chipW + 16;
    });
    y += rowGap + (chipY > y + 60 ? 76 : 0);
  });

  // Footer
  ctx.textAlign = 'center';
  ctx.font = '400 36px "Space Grotesk", sans-serif';
  ctx.fillStyle = 'rgba(240,237,232,.55)';
  ctx.fillText(`${SETTINGS.wa || ''}`, W / 2, H - 120);

  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'aleink-disponibilidad-' + getTodayStr() + '.png';
  a.click();
  toast('Imagen descargada', '<svg class="icon"><use href="#i-share"></use></svg>', 'success');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
