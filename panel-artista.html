// ═══════════════════════════════════════════════════════
//  GESTIÓN DE FOCO EN DIÁLOGOS (accesibilidad)
//  Al abrir: el foco entra al diálogo. Al cerrar: vuelve
//  al elemento que lo abrió (patrón WAI-ARIA para dialogs).
// ═══════════════════════════════════════════════════════
let _lastFocus = null;

function focusDialog(id, sel) {
  _lastFocus = document.activeElement;
  setTimeout(() => {
    const root = document.getElementById(id);
    if (!root) return;
    const target = (sel && root.querySelector(sel)) || root;
    target.focus({ preventScroll: true });
  }, 80);
}

function restoreFocus() {
  if (_lastFocus && typeof _lastFocus.focus === 'function' && document.contains(_lastFocus)) {
    _lastFocus.focus({ preventScroll: true });
  }
  _lastFocus = null;
}

// ═══════════════════════════════════════════════════════
//  BOTTOM SHEET — drag-to-dismiss (AirPods-style gesture)
//  Reusable for any modal sheet (session, quote detail, etc.)
// ═══════════════════════════════════════════════════════
function makeSheetDraggable(sheetId, handleId, closeFn) {
  const sheet = document.getElementById(sheetId);
  const handle = document.getElementById(handleId);
  if (!sheet || !handle) return;

  let startY = 0, currentY = 0, dragging = false;

  function onMove(e) {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    currentY = y;
    const delta = Math.max(0, currentY - startY);
    sheet.style.transform = `translateY(${delta}px)`;
    if (delta > 4 && e.cancelable) e.preventDefault();
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('dragging');
    const delta = currentY - startY;
    if (delta > 110) closeFn();
    sheet.style.transform = '';
    // Quita los listeners globales: mientras no se arrastra, el documento queda limpio
    document.removeEventListener('touchmove', onMove, {passive:false});
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
  }
  function onStart(e) {
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const fromHandle = e.target === handle || handle.contains(e.target);
    // Solo arrastra si el gesto nace en el "handle" del sheet (la barrita de arriba)
    if (!fromHandle) return;
    startY = y; currentY = y; dragging = true;
    sheet.classList.add('dragging');
    // Adjunta los listeners SOLO durante el arrastre, y solo cuando de verdad empezó en el handle
    if (e.touches) {
      document.addEventListener('touchmove', onMove, {passive:false});
      document.addEventListener('touchend', onEnd);
    } else {
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
    }
  }

  handle.addEventListener('touchstart', onStart, {passive:true});
  handle.addEventListener('mousedown', onStart);
}

// ── Respaldo de tap para iOS standalone (web-app instalada en la pantalla de inicio) ──
// En Safari standalone, el onclick inline sobre <div> a veces no dispara. Este listener
// delegado captura el tap directamente y abre la cotización de forma fiable.
(function setupTapFallback(){
  const main = document.querySelector('.main') || document.body;
  let tsX = 0, tsY = 0, moved = false;
  main.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    tsX = t.clientX; tsY = t.clientY; moved = false;
  }, {passive:true});
  main.addEventListener('touchmove', (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    if (Math.abs(t.clientX - tsX) > 10 || Math.abs(t.clientY - tsY) > 10) moved = true;
  }, {passive:true});
  main.addEventListener('touchend', (e) => {
    if (moved) return; // fue un scroll, no un tap
    const card = e.target.closest && e.target.closest('.qcard[data-quote-idx]');
    if (!card) return;
    const idx = parseInt(card.getAttribute('data-quote-idx'), 10);
    if (isNaN(idx)) return;
    const modal = document.getElementById('quoteModal');
    if (modal && modal.classList.contains('open')) return; // ya abierto
    e.preventDefault();
    openQuoteDetail(idx);
  }, {passive:false});

  // Desktop / mouse: click delegado (equivalente al tap móvil)
  main.addEventListener('click', (e) => {
    const card = e.target.closest && e.target.closest('.qcard[data-quote-idx]');
    if (!card) return;
    const idx = parseInt(card.getAttribute('data-quote-idx'), 10);
    if (isNaN(idx)) return;
    const modal = document.getElementById('quoteModal');
    if (modal && modal.classList.contains('open')) return; // ya abierto (evita click sintético de iOS)
    openQuoteDetail(idx);
  });
})();

//  CUSTOM CONFIRM DIALOG (replaces native confirm())
// ═══════════════════════════════════════════════════════
let _confirmCallback = null;

function showConfirm({ icon = '<svg class="icon"><use href="#i-alert-triangle"></use></svg>', title, body, okLabel = 'Eliminar', onOk }) {
  document.getElementById('confirmIcon').innerHTML = icon;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = body;

  _confirmCallback = onOk;
  document.getElementById('confirmOverlay').classList.add('open');

}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  _confirmCallback = null;
  restoreFocus();
}

function _confirmOk() {
  const cb = _confirmCallback;
  closeConfirm();
  if (cb) cb();
}

// Wire up the OK button once (not inline, to avoid duplicate listeners)
document.getElementById('confirmOk').addEventListener('click', _confirmOk);
// Close on overlay click
document.getElementById('confirmOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('confirmOverlay')) closeConfirm();
});

// ═══════════════════════════════════════════════════════
//  THEME (light / dark)
// ═══════════════════════════════════════════════════════
function toggleTheme() {
  const root = document.documentElement;
  const isLight = root.getAttribute('data-theme') === 'light';
  if (isLight) {
    root.removeAttribute('data-theme');
    localStorage.setItem('aleink_theme', 'dark');
  } else {
    root.setAttribute('data-theme', 'light');
    localStorage.setItem('aleink_theme', 'light');
  }
  syncThemeToggle();
}

function syncThemeToggle() {
  const t = document.getElementById('themeToggle');
  if (t) t.setAttribute('aria-checked', document.documentElement.getAttribute('data-theme') === 'light');
}
syncThemeToggle();

//  STATS TAB
// ═══════════════════════════════════════════════════════
function buildStatsTab() {
  const totalDep = QUOTES.filter(q => q.deposit).reduce((s,q) => s+q.deposit, 0);
  const sessIncome = SESSIONS.filter(s => s.status==='done' && s.price).reduce((s,x) => s+x.price, 0);
  const totalIncome = totalDep + sessIncome;
  const conv = QUOTES.length ? Math.round(QUOTES.filter(q=>q.status==='approved'||q.status==='done').length/QUOTES.length*100) : 0;

  // Style distribution
  const styleCount = {};
  QUOTES.forEach(q => { styleCount[q.style] = (styleCount[q.style]||0)+1; });
  const totalQ = QUOTES.length || 1;
  const styleRows = Object.entries(styleCount).sort((a,b)=>b[1]-a[1]).map(([k,v]) => ({
    name: STYLES_MAP[k]||k, pct: Math.round(v/totalQ*100)
  }));

  // Monthly revenue from sessions (last 6 months)
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth()-i);
    months.push({key: localYMD(d).slice(0,7), label: d.toLocaleDateString('es-CL',{month:'short'}).replace('.','').toUpperCase()});
  }
  const revenues = months.map(m => {
    return SESSIONS.filter(s => s.date.startsWith(m.key) && s.status==='done' && s.price).reduce((s,x)=>s+x.price,0);
  });
  const maxRev = Math.max(...revenues, 1);

  let html = `
  <div class="sp" style="padding-bottom:0">
    <div class="kpi-grid" style="padding:0 0 8px">
      <div class="kpi red"><div class="kpi-lbl">Abonos</div><div class="kpi-val red">$${fmtK(totalDep)}</div></div>
      <div class="kpi grn"><div class="kpi-lbl">Ingresos sesiones</div><div class="kpi-val grn">$${fmtK(sessIncome)}</div></div>
      <div class="kpi amb"><div class="kpi-lbl">Conversión</div><div class="kpi-val amb">${conv}%</div></div>
      <div class="kpi blu"><div class="kpi-lbl">Total citas</div><div class="kpi-val blu">${QUOTES.length}</div></div>
    </div>
  </div>
  <div class="stats-wrap">
    <div class="chart-card">
      <div class="chart-lbl">Ingresos por mes (sesiones)</div>
      <div class="bars" id="revBars">
        ${months.map((m,i) => `<div class="bar-col">
          <div class="bar-fill" data-v="$${fmtK(revenues[i])}" style="height:${revenues[i]?Math.max(Math.round(revenues[i]/maxRev*100),4):3}%;background:${revenues[i]?'var(--red)':'var(--bg4)'}"></div>
          <div class="bar-lbl">${m.label}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-lbl">Distribución por estilo</div>
      <div class="style-rows">
        ${styleRows.length ? styleRows.map(r => `
          <div class="style-row">
            <div class="style-name">${r.name}</div>
            <div class="style-bar-wrap"><div class="style-bar-fill" data-pct="${r.pct}" style="width:0%"></div></div>
            <div class="style-pct">${r.pct}%</div>
          </div>`).join('') : '<div style="font-family:var(--m);font-size:.68rem;color:var(--w60);letter-spacing:.2em">SIN DATOS</div>'}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-lbl">Estado de cotizaciones</div>
      <div class="style-rows">
        ${[{label:'Pendientes',key:'pending',color:'var(--amber)'},{label:'Aprobadas',key:'approved',color:'var(--green)'},{label:'Completadas',key:'done',color:'var(--blue)'},{label:'Rechazadas',key:'rejected',color:'var(--w35)'}].map(r => {
          const cnt = QUOTES.filter(q=>q.status===r.key).length;
          const pct = totalQ ? Math.round(cnt/QUOTES.length*100)||0 : 0;
          return `<div class="style-row">
            <div class="style-name">${r.label}</div>
            <div class="style-bar-wrap"><div class="style-bar-fill" data-pct="${pct}" style="width:0%;background:${r.color}"></div></div>
            <div class="style-pct">${cnt}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  <div class="scroll-bottom-pad"></div>`;
  return html;
}

function animBars() {
  setTimeout(() => {
    document.querySelectorAll('.style-bar-fill').forEach(el => {
      el.style.width = (el.dataset.pct || 0) + '%';

        <label class="field-label" for="sPin">Nuevo PIN (4 dígitos)</label>
        <input class="finp" id="sPin" type="password" maxlength="4" placeholder="Nuevo PIN" style="max-width:120px"/>
      </div>
      <button class="export-btn" style="max-width:200px" onclick="changePin()"><svg class="icon"><use href="#i-lock"></use></svg> Cambiar PIN</button>
    </div>

    <div class="settings-section">
      <div class="settings-sec-title">Automatizaciones</div>
      ${[
        {key:'autoWA', label:'WhatsApp automático', sub:'Notificación al recibir cotización'},
        {key:'reminder72', label:'Recordatorio 72h', sub:'Enviado al cliente por WA'},
        {key:'reminder24', label:'Instrucciones 24h antes', sub:'Email + WA con cuidados previos'},
        {key:'aftercare', label:'Aftercare automático', sub:'Enviado 1h después de la sesión'},
      ].map(s => `
        <div class="setting-row">
          <div class="sr-left"><div class="sr-title">${s.label}</div><div class="sr-sub">${s.sub}</div></div>
          <button class="toggle ${SETTINGS[s.key]?'on':''}" id="tog-${s.key}" role="switch" aria-checked="${!!SETTINGS[s.key]}" aria-label="${s.label}" onclick="toggleSetting('${s.key}')"></button>
        </div>`).join('')}
    </div>

    <div class="settings-section">
      <div class="settings-sec-title">Exportar datos</div>
      <button class="export-btn" onclick="exportCSV()"><svg class="icon"><use href="#i-bar-chart"></use></svg> Exportar cotizaciones CSV</button>
      <button class="export-btn" onclick="exportSessionsCSV()"><svg class="icon"><use href="#i-calendar"></use></svg> Exportar sesiones CSV</button>
      <button class="export-btn" style="color:var(--red);background:var(--red3)" onclick="resetData()"><svg class="icon"><use href="#i-trash"></use></svg> Restablecer datos (demo)</button>
    </div>

    <button class="save-btn" onclick="saveSettingsUI()">Guardar configuración →</button>
  </div>
  <div class="scroll-bottom-pad"></div>`;
}

function toggleSetting(key) {
  SETTINGS[key] = !SETTINGS[key];
  const el = document.getElementById('tog-' + key);
  if (el) { el.classList.toggle('on', SETTINGS[key]); el.setAttribute('aria-checked', SETTINGS[key]); }
}

function saveSettingsUI() {
  SETTINGS.studioName = document.getElementById('sStudio')?.value.trim() || SETTINGS.studioName;
  SETTINGS.wa = document.getElementById('sWA')?.value.trim() || SETTINGS.wa;
  SETTINGS.email = document.getElementById('sEmail')?.value.trim() || SETTINGS.email;
  SETTINGS.deposit = parseInt(document.getElementById('sDeposit')?.value) || SETTINGS.deposit;
  saveSettings();
  toast('Configuración guardada', '<svg class="icon"><use href="#i-check-circle"></use></svg>', 'success');
}

function changePin() {
  const np = document.getElementById('sPin')?.value.trim();
  if (!np || np.length !== 4 || !/^\d+$/.test(np)) { toast('PIN debe ser 4 dígitos', '<svg class="icon"><use href="#i-alert-triangle"></use></svg>', 'warn'); return; }
  localStorage.setItem(PIN_KEY, np);
  document.getElementById('sPin').value = '';
  toast('PIN actualizado', '<svg class="icon"><use href="#i-lock"></use></svg>', 'success');
}

function exportCSV() {
  const headers = ['ID','Nombre','Instagram','WhatsApp','Estilo','Zona','Ancho','Alto','Concepto','Estado','Precio','Abono','Fecha'];
  const rows = QUOTES.map(q => [q.id,q.name,q.ig,q.wa,q.style,q.zone||'',q.w,q.h,`"${String(q.concept||'').replace(/"/g,'""')}"`,q.status,q.price||'',q.deposit||'',q.date]);
  const csv = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
  dlCSV(csv, 'aleink-cotizaciones');
}

function exportSessionsCSV() {
  const headers = ['ID','Cliente','Fecha','Hora','Estilo','Zona','Duración','Precio','Notas','Estado'];
  const rows = SESSIONS.map(s => [s.id,s.name,s.date,s.time,s.style,s.zone||'',s.dur,s.price||'',`"${(s.notes||'').replace(/"/g,'""')}"`,s.status]);
  const csv = [headers.join(','), ...rows.map(r=>r.join(','))].join('\n');
  dlCSV(csv, 'aleink-sesiones');
}

function dlCSV(csv, name) {
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = name + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('CSV exportado', '<svg class="icon"><use href="#i-bar-chart"></use></svg>', 'success');
}

function resetData() {
  showConfirm({
    icon: '<svg class="icon"><use href="#i-alert-triangle"></use></svg>',
    title: 'Restablecer datos',
    body: 'Se borrarán todas las cotizaciones y sesiones actuales y se cargarán los datos de ejemplo. Esto no se puede deshacer.',
    okLabel: 'Sí, restablecer',
    onOk: () => {
      QUOTES = [...DEFAULT_QUOTES];
      SESSIONS = [...DEFAULT_SESSIONS];
      saveQuotes();
      saveSessions();
      toast('Datos restablecidos', '<svg class="icon"><use href="#i-check"></use></svg>');
      renderTab();
    }
  });
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function fmt(n) {
  if (!n) return '0';
  return Number(n).toLocaleString('es-CL');
}

function fmtK(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return Math.round(n/1000) + 'K';
  return fmt(n);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function localYMD(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getTodayStr() {
  return localYMD(new Date());
}

function toast(msg, icon='<svg class="icon"><use href="#i-check"></use></svg>', type='') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast${type?' '+type:''}`;
  t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(14px)';
    t.style.transition = 'all .35s';
    setTimeout(() => t.remove(), 380);
  }, 3600);
}

// ── Limpieza de datos ficticios del localStorage ──
// Si existen datos con IDs de ejemplo (S-001, Q-001, etc.) MEZCLADOS
// con datos reales, se eliminan solo los de ejemplo.
// FIX: antes esto corría siempre, apenas encontraba los IDs de ejemplo
// los borraba — incluso si esos 3 registros eran TODO lo que había.
// Resultado: quien abría el panel por primera vez veía 3 cotizaciones
// y 3 sesiones de ejemplo, y con solo recargar la página una vez ya
// estaban en cero, como si hubiera perdido datos reales. Ahora la
// limpieza solo actúa cuando además de los IDs de ejemplo hay algún
// registro real (de ale.html) — recién ahí tiene sentido "limpiar".
// ── Accesibilidad: cerrar cualquier modal/drawer abierto con Escape ──
// Comportamiento estándar esperado en cualquier diálogo — no existía.
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('qdLightbox')?.classList.contains('open')) { closeLightbox(); return; }
  if (document.getElementById('quoteModal')?.classList.contains('open')) { closeQuoteModal(); return; }
  if (document.getElementById('sessModal')?.classList.contains('open')) { closeSessModal(); return; }
  if (document.getElementById('slotModal')?.classList.contains('open')) { closeSlotModal(); return; }
  if (document.getElementById('shareModal')?.classList.contains('open')) { closeShareModal(); return; }
  if (document.getElementById('notifOverlay')?.classList.contains('show')) { closeNotifDrawer(); return; }
});

(function purgeDemo() {
  try {
    const FAKE_IDS = ['Q-001','Q-002','Q-003'];
    const FAKE_SESSION_IDS = ['S-001','S-002','S-003'];
    const qraw = localStorage.getItem('aleink_quotes');
    if (qraw) {
      const qs = JSON.parse(qraw);
      const hasRealData = qs.some(q => !FAKE_IDS.includes(q.id));
      if (hasRealData) {
        const cleaned = qs.filter(q => !FAKE_IDS.includes(q.id));
        if (cleaned.length !== qs.length) {
          localStorage.setItem('aleink_quotes', JSON.stringify(cleaned));
        }
      }
    }
    const sraw = localStorage.getItem('aleink_sessions');
    if (sraw) {
      const ss = JSON.parse(sraw);
      const hasRealSessions = ss.some(s => !FAKE_SESSION_IDS.includes(s.id));
      if (hasRealSessions) {
        const cleaned = ss.filter(s => !FAKE_SESSION_IDS.includes(s.id));
        if (cleaned.length !== ss.length) {
          localStorage.setItem('aleink_sessions', JSON.stringify(cleaned));
        }
      }
    }
  } catch(e) {}
})();

if (getPin() !== '1234') {

// Already unlocked in same session?
if (sessionStorage.getItem('aleink_unlocked') === '1') {
  unlocked = true;

  initApp();
}
